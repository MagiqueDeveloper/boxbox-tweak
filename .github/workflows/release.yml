name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: macos-14
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      # lint.sh's version section refuses to pass when the tag and
      # src/BBVersion.h disagree, so a mistyped tag cannot publish a mislabelled
      # binary.
      - name: Check the tag against src/BBVersion.h
        run: TAG="${GITHUB_REF_NAME}" ./scripts/lint.sh

      - name: Build
        run: make build

      - name: Verify and checksum
        run: |
          set -euo pipefail
          dylib=build/BoxBox.dylib
          test -f "$dylib"

          otool -D "$dylib" | tail -1 | grep -qx '@executable_path/Frameworks/BoxBox.dylib'
          lipo -info "$dylib" | grep -q arm64
          codesign --verify --verbose=1 "$dylib"

          shasum -a 256 "$dylib" > "$dylib.sha256"
          cat "$dylib.sha256"

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/BoxBox.dylib
            build/BoxBox.dylib.sha256
          generate_release_notes: true
          draft: false
          # A tag like v1.1.0-rc1 publishes as a pre-release.
          prerelease: ${{ contains(github.ref_name, '-') }}
