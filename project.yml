name: BoxBox
options:
  bundleIdPrefix: com.boxbox
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: NO
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    CODE_SIGNING_ALLOWED: NO
    CLANG_ENABLE_OBJC_ARC: YES
    CLANG_ENABLE_MODULES: YES
    MACH_O_TYPE: mh_dylib
    GENERATE_INFOPLIST_FILE: YES
    # This is the load path the injected LC_LOAD_DYLIB will point at.
    LD_DYLIB_INSTALL_NAME: "@executable_path/Frameworks/BoxBox.dylib"
    DYLIB_INSTALL_NAME_BASE: "@executable_path/Frameworks"
    # Treat the compiler as a reviewer: warnings fail the build.
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    CLANG_WARN_DOCUMENTATION_COMMENTS: YES
    CLANG_WARN_STRICT_PROTOTYPES: YES
    CLANG_WARN_UNREACHABLE_CODE: YES
    CLANG_WARN_EMPTY_BODY: YES
    CLANG_WARN_ENUM_CONVERSION: YES
    CLANG_WARN_INT_CONVERSION: YES
    CLANG_WARN_SUSPICIOUS_MOVE: YES
    CLANG_WARN_BLOCK_CAPTURE_AUTORELEASING: YES
    CLANG_ANALYZER_LOCALIZABILITY_NONLOCALIZED: YES
    GCC_WARN_UNDECLARED_SELECTOR: YES
    GCC_WARN_UNUSED_FUNCTION: YES
    GCC_WARN_UNUSED_VARIABLE: YES
    GCC_WARN_UNINITIALIZED_AUTOS: YES
    GCC_WARN_SHADOW: YES

targets:
  BoxBox:
    type: library.dynamic
    platform: iOS
    sources:
      - path: src
    settings:
      base:
        PRODUCT_NAME: BoxBox
        PRODUCT_BUNDLE_IDENTIFIER: com.boxbox.dylib
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/src"
        SKIP_INSTALL: YES
        DEFINES_MODULE: NO
